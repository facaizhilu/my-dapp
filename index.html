<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>រង្វាន់សំណាង - ហ្គេមបង្វិល</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="cyber-space">
        <div class="grid-overlay"></div>
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <div class="app-container">
        <header class="header">
            <h1 class="title"></h1>
            <p class="subtitle"></p>
        </header>

        <main class="main-content">
            <div class="wheel-wrapper">
                <div class="wheel-glow"></div>
                <div class="wheel-pointer"></div>
                <div class="wheel-container" id="wheel">
                    <div class="wheel-slice slice-1"><span>តុក្កតា</span></div>
                    <div class="wheel-slice slice-2"><span>ទូរស័ព្ទ</span></div>
                    <div class="wheel-slice slice-3"><span>កាដូពិសេស</span></div>
                    <div class="wheel-slice slice-4"><span>តុក្កតា</span></div>
                    <div class="wheel-slice slice-5"><span>មាស</span></div>
                    <div class="wheel-slice slice-6"><span>រង្វាន់ធំ</span></div>
                </div>
                <div class="wheel-center">
                    <div class="center-dot"></div>
                </div>
            </div>

            <div class="action-area">
                <button class="cyber-btn" id="spinBtn">
                    <span class="btn-glow"></span>
                    <span class="btn-text">សាកល្បងសំណាង</span>
                </button>
            </div>
        </main>
    </div>

    <!-- 星际穿越跃迁动画层 -->
    <div class="warp-transition-overlay" id="transitionOverlay">
        <div class="stars-container" id="starsContainer"></div>
        <div class="warp-core"></div>
        <div class="warp-message">
            <div class="khmer-text-glow">សំណាងល្អនឹងស្ថិតនៅជាមួយអ្នកជានិច្ច វាកំពុងតែមកដល់ហើយ!</div>
            <div class="warp-subtext">Warping to destination...</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
